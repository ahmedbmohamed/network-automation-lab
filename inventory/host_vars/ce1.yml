# Customer site 1: announces its LAN (loopback) to the provider
router_id: 172.16.1.1
loopback: 172.16.1.1/32
interfaces:
  - name: eth1
    description: to-pe1
    ip: 192.168.1.2/30
bgp:
  asn: 65001
  networks:
    - 172.16.1.1/32
  neighbors:
    - ip: 192.168.1.1
      remote_as: 65000
      description: provider-pe1
