# Provider edge 1: faces customer ce1
router_id: 10.255.0.1
loopback: 10.255.0.1/32
interfaces:
  - name: eth1
    description: to-ce1
    ip: 192.168.1.1/30
  - name: eth2
    description: to-p1
    ip: 10.0.12.1/30
    ospf: true
ospf:
  area: 0
bgp:
  asn: 65000
  neighbors:
    - ip: 10.255.0.2
      remote_as: 65000
      description: p1-route-reflector
      update_source: lo
      next_hop_self: true
    - ip: 192.168.1.2
      remote_as: 65001
      description: customer-ce1
