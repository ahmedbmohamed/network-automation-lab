# Ansible inventory. Each router is a Containerlab container named clab-netlab-<host>.
all:
  vars:
    lab_name: netlab
    container_prefix: "clab-{{ lab_name }}-"
    # Run modules with the same Python that runs Ansible (it has the docker SDK)
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    core:
      hosts:
        pe1:
        p1:
        pe2:
    customers:
      hosts:
        ce1:
        ce2:
